name: Release
description: Initiate a new SDK release. Created by the /release-prep skill — do not fill in manually unless preparing a hotfix.
labels:
  - release
  - "status: pending tests"
body:
  - type: markdown
    attributes:
      value: |
        > **Internal use only.** This issue drives the automated release pipeline.
        > It is normally created by the `/release-prep` skill. Fill it in manually only for hotfix releases.
        > Do not include SAP-internal or customer-specific information.

  - type: input
    id: version
    attributes:
      label: Version
      description: "New version to release (no leading `v`). Must be a valid PEP 440 / SemVer string."
      placeholder: "0.57.0"
    validations:
      required: true

  - type: dropdown
    id: bump_type
    attributes:
      label: Bump Type
      description: "SemVer change type for this release."
      multiple: false
      options:
        - patch
        - minor
        - major
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Branch
      description: "Branch to release from. Must already be pushed to origin."
      placeholder: "feature/my-feature"
    validations:
      required: true

  - type: textarea
    id: release_notes
    attributes:
      label: Release Notes
      description: "Changelog entry for this release. Will be used as the GitHub Release body."
      placeholder: |
        ### What's New
        - ...

        ### Improvements
        - ...

        ### Bug Fixes
        - ...
    validations:
      required: true

  - type: textarea
    id: breaking_changes
    attributes:
      label: Breaking Changes
      description: "List breaking changes and migration steps. Leave blank if there are none — the release workflow handles an empty value correctly."
      placeholder: |
        > ⚠️ Important: migration steps for users upgrading from the previous version.
        - **[Breaking Change]**: ...
    validations:
      required: false
