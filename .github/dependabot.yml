version: 2
updates:
  # Python pip dependencies
  # Non-major (minor + patch) version updates are batched into one grouped PR;
  # majors are left ungrouped so each breaking bump lands in its own PR for
  # review. Security updates (enabled in repo settings) come as a separate
  # grouped PR of their own
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      version-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
    # Commit message configuration
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Pull request configuration
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    # Target branch for updates
    target-branch: "main"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
    # Batch all Actions bumps (including majors) into one PR
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
