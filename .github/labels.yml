# Label definitions for SAP Cloud SDK for Python
# Apply with: gh label create --repo SAP/cloud-sdk-python (see docs/DEVELOPMENT.md)
# Or use the sync-labels workflow to reconcile all labels at once.

# ── Release pipeline ────────────────────────────────────────────────────────

- name: release
  color: "0052CC"
  description: "Marks an issue as a release pipeline issue. Monitored by the automation test repo."

# Release status state machine (exactly one status label is set at a time):
#   pending tests → tests running → tests passed → releasing → released
#                              └──→ tests failed  (terminal failure)
#                                                 └──→ release failed (terminal failure)

- name: "skip-integration-tests"
  color: "E4E669"
  description: "Add to a release issue to skip the integration test step in the release workflow. Use only when tests are known-good or infra is unavailable."


  color: "FBCA04"
  description: "Release issue created; waiting for the automation test repo to pick it up."

- name: "status: tests running"
  color: "E4E669"
  description: "Automation test repo has started tests for this release branch."

- name: "status: tests passed"
  color: "0E8A16"
  description: "All automation tests passed. Triggers the release GitHub Action."

- name: "status: tests failed"
  color: "B60205"
  description: "Automation tests failed. Release is blocked — investigate before retrying."

- name: "status: releasing"
  color: "1D76DB"
  description: "Release workflow is running: bumping version, tagging, publishing to PyPI."

- name: "status: released"
  color: "6F42C1"
  description: "Package published to PyPI and GitHub Release created. Issue will be closed automatically."

- name: "status: release failed"
  color: "B60205"
  description: "Release workflow failed after tests passed. Check the workflow run and clean up the tag before retrying."

# ── Existing labels (kept for reference — do not duplicate) ─────────────────
# bug, documentation, duplicate, enhancement, good first issue, help wanted,
# invalid, question, wontfix, dependencies, python, python:uv,
# sdk-review: ✅ passed, sdk-review: ❌ blocked, sdk-review: ⚠️ flagged,
# sdk-review: skipped, feature-request, github-actions, tok:pd1, tok:pd2, tok:pd9
