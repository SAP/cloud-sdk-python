name: Release

on:
  issues:
    types: [labeled]
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true
      branch:
        description: 'Branch to release from'
        required: true
      bump_type:
        description: 'Bump type (major/minor/patch)'
        required: false
        default: 'minor'

jobs:
  # ── 1. Parse inputs and validate version ──────────────────────────────────
  parse:
    name: Parse & Validate
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.label.name == 'status: tests passed' &&
      contains(github.event.issue.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      version:    ${{ steps.issue.outputs.version }}
      branch:     ${{ steps.issue.outputs.branch }}
      bump_type:  ${{ steps.issue.outputs.bump_type }}
      tag:        ${{ steps.issue.outputs.tag }}

    steps:
      - name: Parse release issue
        id: issue
        env:
          BODY: ${{ github.event.issue.body }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            BRANCH="${{ github.event.inputs.branch }}"
            BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Hardcoded test values — remove pull_request trigger before merging to main
            VERSION="0.100.0"
            BRANCH="feature/release-process"
            BUMP_TYPE="minor"
          else
            parse_field() {
              local heading="$1"
              echo "$BODY" \
                | awk "/^### ${heading}/{found=1; next} found && /^###/{exit} found{print}" \
                | sed '/^[[:space:]]*$/d' \
                | head -1 \
                | xargs
            }

            VERSION=$(parse_field "Version")
            BRANCH=$(parse_field "Branch")
            BUMP_TYPE=$(parse_field "Bump Type")

            if [[ -z "$VERSION" || -z "$BRANCH" ]]; then
              echo "ERROR: Could not parse Version or Branch from the release issue body."
              echo "Issue body:"
              echo "$BODY"
              exit 1
            fi
          fi

          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"       >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"      >> "$GITHUB_OUTPUT"

          echo "Parsed — version: $VERSION, branch: $BRANCH, bump_type: $BUMP_TYPE"

      - name: Validate version string
        run: |
          pip install packaging -q
          python3 -c "
          from packaging.version import Version, InvalidVersion
          try:
              v = Version('${{ steps.issue.outputs.version }}')
              print(f'Version is valid PEP 440: {v}')
          except InvalidVersion as e:
              print(f'ERROR: {e}')
              raise SystemExit(1)
          "

      - name: Update issue — release in progress
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo "${{ github.repository }}" \
            --remove-label "status: tests passed" \
            --add-label "status: releasing" || true
          gh issue comment ${{ github.event.issue.number }} \
            --repo "${{ github.repository }}" \
            --body "🚀 Release workflow started for **v${{ steps.issue.outputs.version }}** from branch \`${{ steps.issue.outputs.branch }}\`."

  # ── 2. Integration tests ───────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    needs: parse
    if: ${{ github.event_name != 'pull_request' && !contains(github.event.issue.labels.*.name, 'skip-integration-tests') }}
    runs-on: ${{ contains(github.server_url, 'github.com') && 'ubuntu-latest' || fromJSON('["self-hosted"]') }}
    permissions:
      contents: read

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --dev

      - name: Set up integration test environment
        run: |
          echo '${{ toJSON(secrets) }}' \
            | jq -r 'to_entries[]
                | select(.key | startswith("CLOUD_SDK_CFG_") or startswith("AICORE_"))
                | "\(.key)=\(.value)"' \
            | while read line; do
                echo "$line" >> $GITHUB_ENV
                echo "Set secret: $(echo "$line" | cut -d= -f1)"
              done
          echo '${{ toJSON(vars) }}' \
            | jq -r 'to_entries[]
                | select(.key | startswith("CLOUD_SDK_CFG_") or startswith("AICORE_"))
                | "\(.key)=\(.value)"' \
            | while read line; do
                echo "$line" >> $GITHUB_ENV
                echo "Set variable: $(echo "$line" | cut -d= -f1)"
              done

      - name: Run integration tests
        run: uv run pytest tests/*/integration/ -v --tb=short

  # ── 3. Version bump ────────────────────────────────────────────────────────
  version-bump:
    name: Version Bump
    needs: [parse, integration-tests]
    if: always() && needs.parse.result == 'success' && (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_branch: ${{ steps.release_branch.outputs.release_branch }}

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.branch }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Validate version bump
        run: |
          CURRENT=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          python .github/scripts/check_version_bump.py "$CURRENT" "${{ needs.parse.outputs.version }}"

      - name: Create release branch and bump version
        id: release_branch
        run: |
          RELEASE_BRANCH="release-action-${{ needs.parse.outputs.tag }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$RELEASE_BRANCH"

          CURRENT=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          sed -i "s/^version = \"${CURRENT}\"/version = \"${{ needs.parse.outputs.version }}\"/" pyproject.toml
          grep '^version = ' pyproject.toml
          echo "Updated pyproject.toml → ${{ needs.parse.outputs.version }}"

          git add pyproject.toml
          git commit -m "chore(release): bump version to ${{ needs.parse.outputs.version }}"
          git push origin "$RELEASE_BRANCH"

          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Release branch pushed: $RELEASE_BRANCH"

      - name: Create and push tag
        run: |
          git tag "${{ needs.parse.outputs.tag }}" -m "Release ${{ needs.parse.outputs.tag }}"
          git push origin "${{ needs.parse.outputs.tag }}"

      - name: Generate bot token
        id: bot_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CLOUD_SDK_BOT_APP_ID }}
          private-key: ${{ secrets.CLOUD_SDK_BOT_PRIVATE_KEY }}

      - name: Open and auto-merge version bump PR
        env:
          GH_TOKEN: ${{ steps.bot_token.outputs.token }}
          VERSION: ${{ needs.parse.outputs.version }}
          TAG: ${{ needs.parse.outputs.tag }}
          RELEASE_BRANCH: ${{ steps.release_branch.outputs.release_branch }}
          TARGET_BRANCH: ${{ needs.parse.outputs.branch }}
        run: |
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base "$TARGET_BRANCH" \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): bump version to ${VERSION}" \
            --body "Automated version bump from the release workflow for [v${VERSION}](https://github.com/${{ github.repository }}/releases/tag/${TAG}). Merges automatically.")

          echo "PR created: $PR_URL"

          # Bot has bypass rights in the ruleset — no --admin flag needed.
          gh pr merge "$PR_URL" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch

          echo "PR merged and release branch deleted."

  # ── 4. Publish ────────────────────────────────────────────────────────────
  publish:
    name: Publish
    needs: [parse, version-bump]
    if: needs.parse.result == 'success' && needs.version-bump.result == 'success'
    runs-on: ubuntu-latest
    # TODO: restore environment before merging to main — needed for PyPI OIDC trusted publishing
    # environment: 'pypi:sap-cloud-sdk'
    permissions:
      contents: write
      id-token: write
    outputs:
      release_url: ${{ steps.gh_release.outputs.release_url }}

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build release distribution
        run: uv build

      - name: Verify build artifacts
        run: |
          wheel_count=$(ls -1 dist/*.whl 2>/dev/null | wc -l)
          tar_count=$(ls -1 dist/*.tar.gz 2>/dev/null | wc -l)
          [[ "$wheel_count" -ge 1 && "$tar_count" -ge 1 ]] || \
            { echo "ERROR: Missing build artifacts (wheels: $wheel_count, sdists: $tar_count)"; exit 1; }
          echo "Build artifacts: $wheel_count wheel(s), $tar_count sdist(s)"
          ls -lh dist/

      - name: Extract release notes
        id: notes
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          echo "$BODY" \
            | awk '/^### Release Notes/{found=1; next} found && /^### (Version|Bump Type|Branch|Breaking Changes)/{exit} found{print}' \
            | sed '/^[[:space:]]*$/d' \
            > /tmp/release_notes.md

          BREAKING=$(echo "$BODY" \
            | awk '/^### Breaking Changes/{found=1; next} found && /^###/{exit} found{print}' \
            | sed '/^[[:space:]]*$/d')

          if [[ -n "$BREAKING" && "$BREAKING" != *"_None_"* ]]; then
            printf '\n%s\n' "$BREAKING" >> /tmp/release_notes.md
          fi

          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Check version does not already exist on PyPI
        run: |
          PKG_NAME=$(python3 -c "import toml; print(toml.load('pyproject.toml')['project']['name'])")
          VERSION="${{ needs.parse.outputs.version }}"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PKG_NAME/$VERSION/json")
          if [[ "$HTTP" == "200" ]]; then
            echo "ERROR: $PKG_NAME $VERSION already exists on PyPI."
            exit 1
          fi
          echo "$PKG_NAME $VERSION is not yet on PyPI — proceeding."

      - name: Create GitHub Release
        id: gh_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IS_PRERELEASE=$(python3 -c "
          from packaging.version import Version
          v = Version('${{ needs.parse.outputs.version }}')
          print('true' if v.is_prerelease else 'false')
          ")

          RELEASE_URL=$(gh release create "${{ needs.parse.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.parse.outputs.version }}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            $([ "$IS_PRERELEASE" = "true" ] && echo "--prerelease") \
            dist/*.whl dist/*.tar.gz)

          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "GitHub Release created: $RELEASE_URL"

      # TODO: uncomment before merging to main
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@v1.14.2

  # ── 5. Close issue ────────────────────────────────────────────────────────
  close-issue:
    name: Close Issue
    needs: [parse, integration-tests, version-bump, publish]
    if: always() && github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout for package name
        if: needs.publish.result == 'success'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.branch }}

      - name: Close release issue — success
        if: needs.publish.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.parse.outputs.version }}
          TAG: ${{ needs.parse.outputs.tag }}
          TARGET_BRANCH: ${{ needs.parse.outputs.branch }}
          RELEASE_URL: ${{ needs.publish.outputs.release_url }}
        run: |
          PKG_NAME=$(python3 -c "import toml; print(toml.load('pyproject.toml')['project']['name'])")
          PYPI_URL="https://pypi.org/project/${PKG_NAME}/${VERSION}/"

          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "status: releasing" \
            --add-label "status: released" || true

          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ✅ **Release v${VERSION} published successfully.**

          | | |
          |---|---|
          | **PyPI** | ${PYPI_URL} |
          | **GitHub Release** | ${RELEASE_URL} |
          | **Tag** | \`${TAG}\` |
          | **Branch** | \`${TARGET_BRANCH}\` |
          EOF
          )"

          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "Closing — package is live on PyPI."

      - name: Mark issue failed on error
        if: needs.parse.result == 'failure' || needs['integration-tests'].result == 'failure' || needs['version-bump'].result == 'failure' || needs.publish.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "status: releasing" \
            --add-label "status: release failed" || true
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "❌ **Release workflow failed.** Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details. The tag may need to be deleted before retrying."
