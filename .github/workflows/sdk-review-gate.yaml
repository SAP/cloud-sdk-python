name: SDK Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check-sdk-review:
    name: SDK review label present
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check for sdk-review label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          echo "Labels on PR: $LABELS"

          if echo "$LABELS" | grep -q "^sdk-review:"; then
            REVIEW_LABEL=$(echo "$LABELS" | grep "^sdk-review:" | head -1)
            echo "Found review label: $REVIEW_LABEL"

            if echo "$REVIEW_LABEL" | grep -q "❌ blocked"; then
              echo "::error::SDK review found blocking issues ($REVIEW_LABEL). Address the findings before merging."
              exit 1
            fi

            echo "SDK review passed ($REVIEW_LABEL)."
            exit 0
          fi

          echo "::error::No sdk-review label found. Run /review-pr in Claude Code before merging."
          exit 1
