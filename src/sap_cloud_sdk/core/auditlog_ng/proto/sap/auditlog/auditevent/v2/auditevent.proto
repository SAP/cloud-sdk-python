  string user_impersonated_id = 4 [(buf.validate.field).required = true];
  UserType user_impersonated_type = 5;
  string context = 6 [(buf.validate.field).string.min_len = 1];
  // The AI agent requesting impersonation
  AiAgent ai_agent = 7;
}

