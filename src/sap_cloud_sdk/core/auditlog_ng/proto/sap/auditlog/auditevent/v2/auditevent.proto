 *   @EventCategoryCode: "EVENT_CATEGORY_CODE_IAM"
 *   @EventMessageText: "Privilege ${privilege} (Type: ${object_type}, ID: ${object_id}) has been added to group ${group}"
 *   @EventDocumentation: "A new privilege has been added to a user group. This privilege grants members of that group access to objects and the ability to perform operations that they are otherwise not permitted to do."
 */
message AuthnPrivilegeToGroupAdd {
  Common common = 1 [(buf.validate.field).required = true];
  string group = 2 [(buf.validate.field).required = true];
  string privilege = 3 [(buf.validate.field).required = true];
  string object_type = 4;
  string object_id = 5;
}

