 *   @EventCode: "AE-0105"
 *   @EventCategoryCode: "EVENT_CATEGORY_CODE_SEC_UNSPECIFIED"
 *   @EventMessageText: "User ${user_initiator_id} was declined impersonation for user ${user_impersonated_id}"
