message UserImpersonationDeclined {
  Common common = 1 [(buf.validate.field).required = true];
  string user_initiator_id = 2 [(buf.validate.field).required = true];
  UserType user_initiator_type = 3;
  string user_impersonated_id = 4 [(buf.validate.field).required = true];
  UserType user_impersonated_type = 5;
  string context = 6 [(buf.validate.field).string.min_len = 1];
  // The AI agent whose request was declined
  AiAgent ai_agent = 7;
}

