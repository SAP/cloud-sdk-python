// ============================================================================
// Autonomous AI Events
// Events for auditing activities in autonomous/agentic scenarios.
// These events can be used by any component in the SAP Autonomous Suite
// (e.g., Agent Gateway, Joule, custom agents, orchestrators).
// Aligned with OCSF 1.10.0-dev AI Operation Profile.
// ============================================================================

// --- Session Events ---

/* AiSessionStart
 *   @EventShortText: "AI session started"
 *   @EventCode: "AE-0087"
 *   @EventCategoryCode: "EVENT_CATEGORY_CODE_SEC_UNSPECIFIED"
 *   @EventMessageText: "AI session ${session_id} started for agent ${ai_agent.name}"
 *   @EventDocumentation: "An AI session has been initiated. This event marks the beginning of an interaction session with an AI system, capturing authentication context and the AI agent/model involved."
 */
message AiSessionStart {
  Common common = 1 [(buf.validate.field).required = true];
  // Unique identifier for this session
  string session_id = 2 [(buf.validate.field).required = true];
  // The AI agent handling this session
  AiAgent ai_agent = 3;
  // The AI model used (if no agent, direct model invocation)
  AiModel ai_model = 4;
  // Delegation context if operating under delegated authority
  AiDelegation delegation = 5;
}

/* AiSessionEnd
 *   @EventShortText: "AI session ended"
 *   @EventCode: "AE-0088"
 *   @EventCategoryCode: "EVENT_CATEGORY_CODE_SEC_UNSPECIFIED"
 *   @EventMessageText: "AI session ${session_id} ended (Reason: ${end_reason})"
 *   @EventDocumentation: "An AI session has been terminated. This event marks the end of an interaction session, capturing the reason for termination and final session metrics."
 */
message AiSessionEnd {
  Common common = 1 [(buf.validate.field).required = true];
  // Unique identifier for this session
  string session_id = 2 [(buf.validate.field).required = true];
  // Reason for session termination
  AiSessionEndReason end_reason = 3;
  // Total tokens consumed in this session
  int32 total_tokens = 4;
  // Session duration in milliseconds
  int64 duration_ms = 5;
}

// --- Prompt Events ---

/* AiPromptReceived
 *   @EventShortText: "AI prompt received"
 *   @EventCode: "AE-0089"
 *   @EventCategoryCode: "EVENT_CATEGORY_CODE_SEC_UNSPECIFIED"
 *   @EventMessageText: "AI prompt received in session ${session_id}"
 *   @EventDocumentation: "A prompt/request has been received by the AI system. This event captures the incoming user or system request before processing."
 */
message AiPromptReceived {
  Common common = 1 [(buf.validate.field).required = true];
  // Session identifier
  string session_id = 2;
  // Message context with prompt details
  AiMessageContext message_context = 3;
  // The AI agent receiving the prompt
  AiAgent ai_agent = 4;
}

/* AiGuardrailTriggered
 *   @EventShortText: "AI guardrail triggered"
 *   @EventCode: "AE-0090"
 *   @EventCategoryCode: "EVENT_CATEGORY_CODE_SEC_UNSPECIFIED"
 *   @EventMessageText: "AI guardrail ${guardrail_name} triggered (Type: ${guardrail_type}, Action: ${action_taken})"
 *   @EventDocumentation: "An AI guardrail has been triggered during input validation or output filtering. Guardrails protect against harmful, inappropriate, or policy-violating content."
 */
message AiGuardrailTriggered {
  Common common = 1 [(buf.validate.field).required = true];
  // Session identifier
  string session_id = 2;
  // Name of the guardrail that was triggered
  string guardrail_name = 3 [(buf.validate.field).required = true];
  // Type of guardrail (input, output, content, policy)
  AiGuardrailType guardrail_type = 4 [(buf.validate.field).required = true];
  // Action taken by the guardrail
