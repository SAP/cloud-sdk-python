// AI Model identification
// Aligned with OCSF ai_model object
// https://schema.ocsf.io/1.10.0-dev/objects/ai_model
message AiModel {
  // AI service provider or organization name (e.g., "SAP", "OpenAI", "Anthropic", "Google")
  string ai_provider = 1 [(buf.validate.field).required = true];
  // Human-readable model name (e.g., "joule-v1", "gpt-4o", "claude-3-sonnet")
  string name = 2;
  // Model's unique identifier
  string uid = 3;
  // Model version identifier (e.g., "2024-05-13", "v2.1.0")
  string version = 4;
}

// AI Agent identification
// Aligned with OCSF ai_agent object
// https://schema.ocsf.io/1.10.0-dev/objects/ai_agent
message AiAgent {
  // Stable logical identifier for the agent (e.g., ORD ID)
  string uid = 1;
  // Human-readable agent designation
  string name = 2;
  // Identifier for a specific running instance or session
  string instance_uid = 3;
  // Agent framework type (string representation)
  string type = 4;
  // Normalized framework identifier
  AiAgentType type_id = 5;
  // Agent's code or configuration revision number
  string version = 6;
  // The AI model backing this agent
  AiModel ai_model = 7;
}

// Message/Conversation context for AI interactions
// Aligned with OCSF message_context object
// https://schema.ocsf.io/1.10.0-dev/objects/message_context
message AiMessageContext {
  // Unique identifier for message correlation (conversation ID)
  string uid = 1;
  // Conversation name, session name, or thread identifier
  string name = 2;
  // The AI's functional role in this interaction
  AiRole ai_role_id = 3;
  // Verbatim input instruction to the model (may contain sensitive data)
  string prompt_text = 4;
  // Model-generated response content (may contain sensitive data)
  string response_text = 5;
  // Input token count
  int32 prompt_tokens = 6;
  // Response/completion token count
  int32 completion_tokens = 7;
  // Combined token usage (prompt + completion)
  int32 total_tokens = 8;
}

// AI Delegation context for authorization tracking
// Aligned with OCSF delegation object
// Links events to authorization contexts under delegated authority
message AiDelegation {
  // The delegating entity (user or agent that granted authority)
  string delegator_id = 1;
  // The entity receiving delegated authority
  string delegate_id = 2;
  // Scope or permissions of the delegation
  repeated string scopes = 3;
  // Expiration time of the delegation
  google.protobuf.Timestamp expires_at = 4;
  // Delegation chain (for multi-hop delegations)
  repeated string delegation_chain = 5;
}

// Common Fields
// contains information that are attached to all events.
message Common {
  //timestamp of the event
  google.protobuf.Timestamp timestamp = 1; // Required format: 2023-10-23T10:00:00.000Z
  //IP Address of the source in IPv4 or IPv6
  repeated string source_ip = 2; // IPv4 or IPv6
  //contains the local user ID, which is used in case of impersonation
  string user_impersonated_id = 3;
  //contains the local user ID, who caused the audit log event
  string user_initiator_id = 4 [(buf.validate.field).required = true];
  //Identifier of the app e.g. App-GUID, FIORI-ID etc.
  string app_id = 5;
  //tenant ID of the source
  string tenant_id = 6;
  //contains the identifier of the respective user session like SAP-Passport
  string user_session_context_id = 7;
  map<string, string> app_context = 8;
  //contains the global user ID, who caused the audit log event
  string user_global_id = 9;
  //contains the global user ID of the impersonated user
  string user_impersonated_global_id = 10;
  //Extended user context for User Initiator
  UserContext user_initiator_context = 11;
  //Extended user context for Impersonated User
  UserContext user_impersonated_context = 12;
  //OpenTelemetry trace context for correlation with distributed traces
  TraceContext trace_context = 13;
}

/* AuditlogClear
