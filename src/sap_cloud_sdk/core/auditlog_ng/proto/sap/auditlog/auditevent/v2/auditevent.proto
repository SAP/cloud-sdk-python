syntax = "proto3";
package sap.auditlog.auditevent.v2;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "sap.com/auditlog/auditevent";

// User context with extended identity information
message UserContext {
  //UserType
  UserType type = 1;
  // Additional custom attributes
  map<string, string> attributes = 2;
}

// OpenTelemetry trace context for correlation with distributed traces
// Follows W3C Trace Context specification (https://www.w3.org/TR/trace-context/)
message TraceContext {
  // The trace-id (32 lowercase hex characters, e.g., "4bf92f3577b34da6a3ce929d0e0e4736")
  optional string trace_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{32}$"];
  // The span-id (16 lowercase hex characters, e.g., "00f067aa0ba902b7")
  optional string span_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{16}$"];
}

